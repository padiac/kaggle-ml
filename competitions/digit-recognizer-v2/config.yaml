competition_name: digit-recognizer
task: classification
target_column: label
id_column: ImageId

# Features will be auto-detected in train.py (pixel0..pixel783)
features:
  numeric: [] 
  categorical: []

model:
  name: logistic_regression
  params:
    l1_ratio: 0.0   
    solver: lbfgs
    max_iter: 1000
    random_state: 42

cv:
  n_splits: 3
  scoring: accuracy
